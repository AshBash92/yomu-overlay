<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Yomu Overlay options</title>
  <style>
    body { max-width: 560px; margin: 40px auto; padding: 0 16px; font: 14px/1.5 "Segoe UI", system-ui, sans-serif; color: #1f1f1f; }
    h1 { font-size: 20px; }
    label { display: block; font-weight: 600; margin: 18px 0 6px; }
    .row { display: flex; gap: 8px; }
    input, select { flex: 1; padding: 8px; border: 1px solid #bbb; border-radius: 6px; font: inherit; }
    button { padding: 8px 14px; border: 1px solid #bbb; border-radius: 6px; background: #f6f6f6; font: inherit; cursor: pointer; }
    button.primary { background: #d84315; border-color: #d84315; color: #fff; font-weight: 600; }
    .hint { font-size: 12px; color: #555; margin-top: 4px; }
    .actions { margin-top: 24px; display: flex; gap: 8px; align-items: center; }
    #message.ok { color: #2e7d32; }
    #message.error { color: #b71c1c; }
  </style>
</head>
<body>
  <h1>Yomu Overlay options</h1>

  <label for="apiKey">Anthropic API key</label>
  <div class="row">
    <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-...">
    <button id="reveal" type="button">Show</button>
  </div>
  <div class="hint">Get one at console.anthropic.com. It's stored only in this browser (chrome.storage.local) and sent only to api.anthropic.com.</div>

  <label for="model">Model</label>
  <div class="row">
    <select id="model">
      <option value="claude-opus-5-5">Claude Opus 5.5 (best quality, default)</option>
      <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (cheaper, faster)</option>
      <option value="claude-haiku-5-5">Claude Haiku 5.5 (cheapest, fastest)</option>
    </select>
  </div>

  <label for="effort">Effort</label>
  <div class="row">
    <select id="effort">
      <option value="low">Low (fastest)</option>
      <option value="medium">Medium (default)</option>
      <option value="high">High (most careful, slowest)</option>
    </select>
  </div>
  <div class="hint">How much Claude thinks before answering. Higher is slower and costs more.</div>

  <div class="actions">
    <button id="save" class="primary">Save</button>
    <button id="test">Test key</button>
    <span id="message"></span>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
